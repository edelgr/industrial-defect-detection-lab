# "How This Algorithm Works" — step-by-step explanations (English).
# Each step: short (diagram label), title, text (Markdown), math, implementation, diagram.
# Diagrams in education/diagrams/ are CONCEPTUAL (generated by scripts/make_diagrams.py); they
# never show real internal activations of a model.

patchcore:
  steps:
    - short: Image
      title: Original image
      text: >-
        PatchCore receives one RGB image. During *fitting* it sees only **normal** training
        images; at *test* time it receives the image we want to inspect. In IDD Lab images are
        resized to 256×256 (no centre-crop, so the map stays aligned with the ground truth).
      implementation: "`core/algorithms/memory_based/anomalib_models.py` → `to_tensor()` (ImageNet normalisation)."
      diagram: patchcore_1.svg
    - short: Patches
      title: Image patches
      text: >-
        The image is not judged as a whole. It is described by a grid of small, overlapping
        **patches** — each feature-map location corresponds to a receptive field in the image.
        A defect only needs to change a few patches to be detected.
      diagram: patchcore_2.svg
    - short: Features
      title: Neural feature extraction
      text: >-
        A CNN pretrained on ImageNet (Wide-ResNet-50-2) computes mid-level features from
        **layer2** and **layer3**. They are generic enough to describe textures and parts, but not
        so specialised to ImageNet classes. A 3×3 average pooling makes each patch feature
        *locally aware* of its neighbourhood.
      math: "φ_ij = concat(pool₃ₓ₃(layer2)_ij, upsample(pool₃ₓ₃(layer3))_ij) ∈ ℝ^1536"
      implementation: "Anomalib `PatchcoreModel.generate_embedding()`; backbone weights from timm (`wide_resnet50_2.racm_in1k`)."
      diagram: patchcore_3.svg
    - short: Memory bank
      title: Memory bank of normal features
      text: >-
        All patch features of all normal training images are collected — easily millions of
        vectors. **Coreset subsampling** (greedy k-center) keeps a small subset (e.g. 10 %) that
        still *covers* the whole set: every original feature has a close representative.
      math: "M_C = argmin_{M_C ⊂ M, |M_C| = r·|M|}  max_{m∈M} min_{n∈M_C} ||m − n||₂   (greedy approximation)"
      implementation: "Anomalib `subsample_embedding()` with `KCenterGreedy`; parameter *Coreset sampling ratio*."
      diagram: patchcore_4.svg
    - short: Nearest neighbour
      title: Nearest-neighbour comparison
      text: >-
        For every patch of the test image, PatchCore searches the most similar patch in the
        memory bank. If the patch is normal, a very close neighbour exists. A scratch produces a
        feature that is **far from everything** seen during fitting.
      math: "s(p) = min_{m ∈ M_C} ||φ(p) − m||₂"
      diagram: patchcore_5.svg
    - short: Scores
      title: Anomaly scores
      text: >-
        The patch distances form a low-resolution score grid. The **image-level score** is the
        maximum patch distance, re-weighted by how isolated the nearest memory element is
        (so that rare-but-normal patches are not over-penalised). Scores are **raw distances**,
        not probabilities.
      math: "s* = max_p s(p);  s = (1 − e^{||p*−m*||} / Σ_{m∈N_b(m*)} e^{||p*−m||}) · s*"
      diagram: patchcore_6.svg
    - short: Heat map
      title: Heat map
      text: >-
        The score grid is bilinearly up-sampled to the image size and smoothed with a Gaussian
        (σ = 4) to obtain the anomaly map shown in the Methods Laboratory.
      diagram: patchcore_7.svg
    - short: Threshold
      title: Decision threshold
      text: >-
        A threshold turns scores into decisions (OK / NOK, defect mask). It must be chosen
        **without test labels** — IDD Lab calibrates it as a high percentile of scores on normal
        images that were not used for fitting. Choosing it on the test set would give
        optimistic, biased results.
      implementation: "`core/inference/session.py` → `LabSession.calibrate()`."
      diagram: patchcore_8.svg

padim:
  steps:
    - short: Normal images
      title: Normal training images
      text: >-
        PaDiM learns from defect-free images only. It assumes the parts are **roughly aligned**:
        position (i, j) in every image shows the same region of the product.
      diagram: padim_1.svg
    - short: Features
      title: Feature extraction
      text: >-
        A pretrained ResNet-18 provides features from layer1–layer3, concatenated per position.
        A random subset of channels (100 for ResNet-18) reduces the dimension.
      implementation: "Anomalib `PadimModel` (random channel index stored with the model)."
      diagram: padim_2.svg
    - short: Per-position
      title: Spatial distributions
      text: >-
        For each patch position (i, j) we now have N feature vectors — one per training image.
        Together they describe what is *normal at that position*.
      diagram: padim_3.svg
    - short: Mean & cov.
      title: Mean and covariance
      text: >-
        Each position is modelled by a multivariate Gaussian with mean μ_ij and covariance Σ_ij
        (plus a small εI for numerical stability).
      math: "μ_ij = (1/N) Σ_k x_ij^k ;  Σ_ij = (1/(N−1)) Σ_k (x_ij^k − μ_ij)(x_ij^k − μ_ij)ᵀ + εI"
      diagram: padim_4.svg
    - short: Mahalanobis
      title: Mahalanobis distance
      text: >-
        A test patch is compared to the Gaussian of its own position with the **Mahalanobis
        distance**, which accounts for correlations between features — directions in which normal
        data vary a lot count less.
      math: "M(x_ij) = sqrt((x_ij − μ_ij)ᵀ Σ_ij⁻¹ (x_ij − μ_ij))"
      diagram: padim_5.svg
    - short: Heat map
      title: Anomaly heat map
      text: >-
        Distances are up-sampled and smoothed into the anomaly map; the image score is its
        maximum. Because statistics are per-position, misaligned objects look anomalous — a key
        difference from PatchCore.
      diagram: padim_6.svg

efficientad:
  steps:
    - short: Teacher
      title: Teacher model
      text: >-
        A small, fast **Patch Description Network (PDN)** is first distilled from a large
        pretrained network (WideResNet-101) on ImageNet. It is then frozen: it 'describes' every
        patch of any image.
      diagram: efficientad_1.svg
    - short: Student
      title: Student model
      text: >-
        A **student** PDN of the same architecture is trained to reproduce the teacher's output —
        but only on normal images of the product.
      diagram: efficientad_2.svg
    - short: Learn normal
      title: Learning from normal examples
      text: >-
        A *hard-feature loss* focuses training on the parts the student gets most wrong, and an
        ImageNet penalty prevents the student from imitating the teacher on non-product images
        too. An autoencoder learns a global (logical) description in parallel.
      math: "L_ST = mean of the top-q % of (T(x) − S(x))²  +  mean (S(x_imagenet))²"
      diagram: efficientad_3.svg
    - short: Disagreement
      title: Feature disagreement
      text: >-
        At test time, wherever the student **fails to imitate** the teacher, the image contains
        something not seen during training. The squared difference is the *local* anomaly map;
        the autoencoder–student difference gives the *global* map.
      math: "A_local = mean_c (T(x)_c − S_ST(x)_c)² ;  A_global = mean_c (A(x)_c − S_AE(x)_c)²"
      diagram: efficientad_4.svg
    - short: Localisation
      title: Anomaly localisation
      text: >-
        Both maps are normalised with quantiles measured on normal validation images and
        averaged; the result is up-sampled to the image size.
      diagram: efficientad_5.svg
    - short: Latency
      title: Runtime considerations
      text: >-
        The PDN has only four convolutional layers and no expensive nearest-neighbour search, so
        inference takes milliseconds on a GPU — the paper reports under 2 ms for EfficientAD-S.
        The price is a training phase (the paper uses 70,000 iterations).
      diagram: efficientad_6.svg

winclip:
  steps:
    - short: Image
      title: Image representation
      text: >-
        CLIP encodes an image into a vector in a space shared with text. WinCLIP uses OpenCLIP
        ViT-B-16-plus-240 (LAION-400M) at 240×240 input.
      diagram: winclip_1.svg
    - short: Prompts
      title: Text prompts
      text: >-
        A **compositional prompt ensemble** describes the two states: e.g. "a photo of a
        flawless {object}", "a cropped photo of a perfect {object}" vs. "a photo of a damaged
        {object}", "… with a defect". Their embeddings are averaged per state.
      diagram: winclip_2.svg
    - short: Similarity
      title: Image–text similarity
      text: >-
        The anomaly score is the softmax probability of the 'anomalous' text embedding versus the
        'normal' one, given the image embedding (temperature τ = 0.07).
      math: "p_a(x) = exp(⟨f(x), t_a⟩/τ) / (exp(⟨f(x), t_n⟩/τ) + exp(⟨f(x), t_a⟩/τ))"
      diagram: winclip_3.svg
    - short: Windows
      title: Window-level comparison
      text: >-
        To localise, the image is split into **windows** at several scales (2×2 and 3×3 patch
        windows); each window is encoded and compared with the prompts. Pixel scores combine all
        windows covering the pixel (harmonic aggregation).
      diagram: winclip_4.svg
    - short: Zero-shot
      title: Zero-shot anomaly estimation
      text: >-
        No training image is needed (zero-shot). With k normal images (few-shot), window features
        are also compared with stored normal window features. Localisation is coarse (16-px
        patches at 240 px) — tiny defects on large images are hard.
      diagram: winclip_5.svg

anomalydino:
  steps:
    - short: k shots
      title: A few normal references
      text: "AnomalyDINO needs only k normal images (often 1–8). No training takes place."
      diagram: anomalydino_1.svg
    - short: DINOv2
      title: DINOv2 patch features
      text: >-
        Each image is resized (448 px in IDD Lab) and encoded by DINOv2 ViT-S/14, giving one
        feature token per 14×14 patch from the last transformer block, L2-normalised.
      diagram: anomalydino_2.svg
    - short: Memory
      title: Memory bank
      text: "All patch tokens of the k references form the memory bank (optionally with background masking)."
      diagram: anomalydino_3.svg
    - short: Cosine NN
      title: Cosine nearest neighbour
      text: "Each test patch gets the cosine distance to its most similar normal patch."
      math: "d(p) = 1 − max_{m ∈ M} ⟨p, m⟩   (unit vectors)"
      diagram: anomalydino_4.svg
    - short: Top-1 %
      title: Image score
      text: "The image score is the mean of the highest 1 % patch distances — robust to single noisy patches."
      diagram: anomalydino_5.svg

pc_deviation:
  steps:
    - short: Normal cloud
      title: Normal point cloud
      text: >-
        One or more defect-free scans of the object serve as the reference. Points are
        down-sampled on a voxel grid and surface normals are estimated.
      diagram: pc_deviation_1.svg
    - short: Test cloud
      title: Test point cloud
      text: "The scan to inspect, in its own coordinate frame (sensor pose may differ)."
      diagram: pc_deviation_2.svg
    - short: Alignment
      title: Alignment (registration)
      text: >-
        A coarse alignment matches FPFH local shape descriptors with RANSAC; then **ICP**
        (point-to-plane) refines the rigid transform. Fitness (inlier ratio) and RMSE tell whether
        alignment succeeded — if it failed, every deviation below is meaningless.
      math: "T* = argmin_T Σ_i ((T p_i − q_i) · n_i)²"
      diagram: pc_deviation_3.svg
    - short: Geometry
      title: Geometric feature extraction
      text: >-
        For each aligned test point we find the nearest reference point and its surface normal —
        a local description of the reference surface.
      diagram: pc_deviation_4.svg
    - short: Comparison
      title: Anomaly comparison
      text: >-
        The deviation is the distance to the reference surface (point-to-plane) or to the nearest
        point. Units are those of the scan (often mm). The object score is a high percentile.
      math: "d_i = |n_j · (T p_i − q_j)|,  j = NN(T p_i)"
      diagram: pc_deviation_5.svg
    - short: 3D colours
      title: Coloured 3D visualisation
      text: >-
        Deviations are mapped to colours on the 3D cloud in the viewer; compare with the
        ground-truth colouring. This is an **educational baseline**, not a published deep 3D method.
      diagram: pc_deviation_6.svg

otsu:
  steps:
    - short: Grey image
      title: Grey-level image
      text: "Convert to grey levels and smooth slightly to reduce noise."
      diagram: otsu_1.svg
    - short: Histogram
      title: Histogram
      text: "Count how many pixels have each grey level (0–255)."
      diagram: otsu_2.svg
    - short: Best split
      title: Best split of the histogram
      text: >-
        For every candidate threshold t, split pixels into two classes and measure how well
        separated they are. Otsu picks the t that maximises the between-class variance.
      math: "t* = argmax_t ω₀(t) ω₁(t) (μ₀(t) − μ₁(t))²"
      diagram: otsu_3.svg
    - short: Mask
      title: Binary mask
      text: >-
        Pixels on the 'defect' side of t* form the mask. On a defect-free surface Otsu still
        splits the image in two — a global threshold has no notion of 'normal'.
      diagram: otsu_4.svg
