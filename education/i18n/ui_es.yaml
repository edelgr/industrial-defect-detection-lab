ref.explain: |
  ### Cómo funciona la *diferencia con imagen de referencia*

  1. **Elija una imagen normal** en `Referencia (normal)`: una imagen *train/good*, nunca una imagen de prueba.
  2. **Niveles de gris.** Ambas imágenes se convierten a gris; si sus tamaños difieren, la referencia se redimensiona al tamaño de la prueba.
  3. **Alineamiento (ECC).** La *imagen de prueba* se deforma sobre la referencia (traslación, rotación o afín) para que la misma parte del objeto caiga en los mismos píxeles. `none` omite este paso. Si ECC no converge, no se aplica ninguna transformación (el título lo indica).
  4. **Desenfoque previo.** Ambas imágenes se suavizan (gaussiano, `blur` px) para atenuar el ruido y los desalineamientos subpíxel.
  5. **Mapa de diferencias** = |prueba − referencia| en cada píxel, en niveles de gris (0–255).
  6. **Umbral.** Los píxeles cuya diferencia alcanza el umbral de píxel se convierten en *diferencias detectadas* (la máscara).

  **Puntuación global frente a diferencias locales.** La *puntuación de imagen* es **un solo número** para toda la imagen (el percentil 99,9 del mapa de diferencias); una decisión OK/NOK la compara con un umbral de imagen calibrado con otras imágenes normales. La *máscara* es **local**: indica *dónde* difieren las dos imágenes. Una diferencia pequeña e intensa puede dar una puntuación alta con muy pocos píxeles; una diferencia amplia y débil puede dar muchos píxeles y una puntuación moderada.

  **Parámetros.** `align`: modelo de movimiento de ECC; `blur`: tamaño impar del núcleo (mayor: menos ruido, pero los defectos pequeños se difuminan); `threshold`: niveles de gris (por defecto 30). El deslizador del umbral de píxel re-umbraliza el mapa en caché sin volver a ejecutar.

  **Limitaciones.** El método detecta *cualquier* diferencia, no solo defectos: la variación normal entre piezas, los cambios de iluminación, las sombras, los reflejos y el desalineamiento residual aparecen en el mapa. El resultado **depende de qué imagen normal sea la referencia**: recorra varias referencias con ◀ ▶, pulse *Comparar* y observe la tabla. Los desplazamientos grandes o los objetos deformables hacen fallar a ECC. Funciona mejor con escenas rígidas, repetibles y bien registradas.

  **Etiquetas retenidas.** En las imágenes `test_private` la verdad de terreno la retiene el benchmark: un OK/NOK mostrado ahí es solo la *predicción* del método y no se calculan métricas con ellas.
