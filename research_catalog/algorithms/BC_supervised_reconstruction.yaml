- id: conv_autoencoder
  group: C
  name: Convolutional autoencoder (reconstruction)
  family: Reconstruction-based anomaly detection
  year: 2019
  paper_title: "Improving Unsupervised Defect Segmentation by Applying Structural Similarity to Autoencoders"
  paper_authors: [Paul Bergmann, Sindy Löwe, Michael Fauser, David Sattlegger, Carsten Steger]
  venue: "VISAPP 2019"
  doi: 10.5220/0007364503720380
  paper_url: https://arxiv.org/abs/1807.02011
  paper_pdf_url: https://www.scitepress.org/Papers/2019/73645/73645.pdf
  official_repository_url: null
  implementation_repository_url: null
  implementation_type: none
  implementation_version: null
  implementation_notes: "Generic lesson: foundations in Hinton & Salakhutdinov (2006) and Masci et al. (2011); this is not DRAEM."
  docs_url: null
  source_license: null
  weights_url: null
  weights_license: null
  learning_paradigm: "Unsupervised (normal images only)"
  training_data_requirements: "Hundreds of normal images; training from scratch"
  supported_modalities: [rgb, grayscale]
  supported_tasks: [segmentation, classification]
  inputs: "Image"
  outputs: "Reconstruction, reconstruction-error map (L2 or 1−SSIM)"
  intuitive_explanation_en: >-
    Train a network to compress and redraw normal images. It learns to redraw only what it has
    seen; at test time, a defect is redrawn poorly, so the reconstruction error highlights it.
  intuitive_explanation_es: >-
    Se entrena una red para comprimir y redibujar imágenes normales. Solo aprende a redibujar lo
    que ha visto; un defecto se reconstruye mal y el error de reconstrucción lo resalta.
  scientific_principle: "A bottleneck encoder–decoder minimising reconstruction loss on normal data; anomaly = high residual."
  main_processing_steps: [Train on normal images, Reconstruct test image, Residual map (L2 or SSIM), Threshold]
  mathematical_formulation: "A(x) = ||x − D(E(x))||² or 1 − SSIM(x, D(E(x)))"
  advantages: [Intuitive, No pretrained features required]
  limitations: ["Generalises too well: may also reconstruct defects", "Blurry reconstructions cause false positives on edges"]
  failure_cases: ["Large homogeneous defects reconstructed correctly", "High-frequency textures"]
  computational_requirements: "GPU training (minutes-hours)"
  recommended_datasets: [D01]
  educational_exercises: ["Discuss the 'identity shortcut' problem of autoencoders"]
  industrial_use: "Historical baseline; superseded by feature-based methods on most benchmarks."
  source_verification_date: "2026-11-20"
  source_verification_status: verified_automated
  implementation_status: explanation_only
  publication_ids: [hinton2006, masci2011, bergmann2019ssimae]

