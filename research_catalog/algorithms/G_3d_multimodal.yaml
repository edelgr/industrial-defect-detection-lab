  weights_url: null
  weights_license: null
  learning_paradigm: "Unsupervised (few normal prototypes)"
  training_data_requirements: "4 normal prototypes per class (Real3D-AD)"
  supported_modalities: [point_cloud]
  supported_tasks: [classification, segmentation]
  inputs: "Point cloud"
  outputs: "Point-level and object-level scores"
  intuitive_explanation_en: >-
    Register every test cloud to the normal prototypes, then compare local point features with a
    memory bank of normal features, combining 'where' (registration) and 'what' (features).
  intuitive_explanation_es: >-
    Registra cada nube de prueba con los prototipos normales y compara características locales con
    un banco de memoria normal, combinando 'dónde' (registro) y 'qué' (características).
  scientific_principle: "Registration-based alignment plus a dual memory bank of point-level and global features."
  main_processing_steps: [Register test to prototypes, Extract point features, Memory-bank comparison, Aggregate scores]
  mathematical_formulation: null
  advantages: [Designed for 360° clouds with few prototypes]
  limitations: ["Registration failures propagate"]
  failure_cases: ["Highly symmetric objects"]
  computational_requirements: "GPU/CPU; large point counts"
  recommended_datasets: [D04]
  educational_exercises: ["Compare with the IDD Lab registration baseline (conceptual)"]
  industrial_use: "Free-form parts without CAD."
