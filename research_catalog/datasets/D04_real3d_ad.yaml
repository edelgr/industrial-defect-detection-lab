id: D04
name: Real3D-AD
acronym: Real3D-AD
adapter: core.datasets.real3d:Real3DADAdapter
description_en: >-
  High-resolution real point clouds of 12 object classes (toys, candies, shells, gemstones ...)
  with bulge and sink defects annotated per point; each class provides only 4 normal
  prototypes for training.
description_es: >-
  Nubes de puntos reales de alta resolución de 12 clases de objetos (juguetes, caramelos,
  conchas, gemas ...) con defectos de protuberancia y hundimiento anotados por punto; cada
  clase ofrece solo 4 prototipos normales para entrenamiento.
scientific_purpose: >-
  Benchmark pure 3D (geometry-only) anomaly detection on complete 360° point clouds, where
  2D cues are unavailable and registration matters.
year_first_release: 2023
publication_year: 2023
authors: [Jiaqi Liu, Guoyang Xie, Ruitao Chen, Xinpeng Li, Jinbao Wang, Yong Liu, Chengjie Wang, Feng Zheng]
institutions: null
publication_title: "Real3D-AD: A Dataset of Point Cloud Anomaly Detection"
publication_venue: "NeurIPS 2023 Datasets and Benchmarks Track"
doi: 10.52202/075280-1324
paper_url: https://proceedings.neurips.cc/paper_files/paper/2023/hash/611b896d447df43c898062358df4c114-Abstract-Datasets_and_Benchmarks.html
paper_pdf_url: https://proceedings.neurips.cc/paper_files/paper/2023/file/611b896d447df43c898062358df4c114-Paper-Datasets_and_Benchmarks.pdf
