access_method: "Google Drive or Baidu Pan links in the README (real3d-ad-pcd.zip for training/evaluation; real3d-ad-ply.zip raw). Size not published."
license: CC BY 4.0 (dataset)
license_url: https://creativecommons.org/licenses/by/4.0/
redistribution_allowed: "Dataset: yes with attribution. Code: no licence file (all rights reserved)."
modalities: [point_cloud]
categories: [airplane, car, candybar, chicken, diamond, duck, fish, gemstone, seahorse, shell, starfish, toffees]
sample_count: 1254
anomaly_types: [geometric, bulge, sink]
annotation_types: [point-level labels]
data_formats: [PCD, PLY, TXT]
image_resolution: "Point clouds; up to ~2 M points per training cloud (class dependent)"
train_split: "4 normal prototypes per class"
validation_split: "none"
test_split: "~100 per class (about 50 good / 50 defective)"
ground_truth_availability: "gt/<stem>.txt: full cloud with an x y z label column (space-delimited)."
benchmark_protocol: "Object-level and point-level AUROC; baselines include BTF, M3DM, PatchCore variants and Reg3D-AD (registration-based)."
principal_challenges:
  - Only 4 training prototypes per class
  - Test clouds are partial/rotated and must be registered
  - Very large point counts
scientific_contribution: "First large real high-precision 3D point-cloud AD dataset; proposes the Reg3D-AD registration-based baseline."
limitations:
  - Defects partly created by copying and cutting edges
  - Training file naming differs between README (prototype) and loader (template)
recommended_educational_exercises:
  - Align a test cloud to a prototype with ICP and colour the deviation
size_notes: "Archive size not published (Google Drive) — check before downloading."
