id: D07
name: Real-IAD D³
acronym: Real-IAD D³
adapter: null
description_en: >-
  A large real-world dataset of 20 electronic and mechanical part categories, each sample
  captured as a high-resolution RGB image, a photometric-stereo pseudo-3D representation and a
  structured-light 3D point cloud.
description_es: >-
  Gran conjunto de datos real de 20 categorías de piezas electrónicas y mecánicas; cada muestra
  incluye una imagen RGB de alta resolución, una representación pseudo-3D por estéreo fotométrico
  y una nube de puntos 3D de luz estructurada.
scientific_purpose: >-
  Study complementarity of 2D appearance, pseudo-3D (surface normals/shading from photometric
  stereo) and true 3D geometry for industrial anomaly detection at high precision.
