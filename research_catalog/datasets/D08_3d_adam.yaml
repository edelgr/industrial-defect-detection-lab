id: D08
name: 3D Anomaly Detection in Additive Manufacturing
acronym: 3D-ADAM
adapter: null
description_en: >-
  14,120 high-resolution RGB + 3D scans of 217 additively manufactured (3D-printed) parts
  acquired with four industrial depth sensors, with 27,346 annotated defects in 12 categories and
  machine-element feature annotations.
description_es: >-
  14 120 escaneos RGB + 3D de alta resolución de 217 piezas fabricadas aditivamente (impresión 3D)
  adquiridos con cuatro sensores de profundidad industriales, con 27 346 defectos anotados en 12
  categorías y anotaciones de elementos de máquina.
scientific_purpose: >-
  Benchmark RGB and 3D anomaly detection on real additive-manufacturing surfaces, where layer
  lines and process artefacts make normality hard to define.
year_first_release: 2025
publication_year: 2026
authors: [Paul McHard, Florent P. Audonnet, Oliver Summerell, Sebastian Andraos, Paul Henderson, Gerardo Aragon-Camarasa]
institutions: [University of Glasgow]
publication_title: "3D-ADAM: A Dataset for 3D Anomaly Detection in Additive Manufacturing"
publication_venue: "IEEE ICRA 2026 (arXiv preprint July 2025)"
doi: 10.1109/ICRA57385.2026.11697283
paper_url: https://arxiv.org/abs/2507.07838
paper_pdf_url: https://arxiv.org/pdf/2507.07838
